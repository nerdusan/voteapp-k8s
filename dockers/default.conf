server {
    listen 8080;
    server_name localhost;

    # Point the root path to /tmp where our index.html files live
    location / {
        root   /tmp;
        index  index.html index.htm;
    }

    # Fallback error page mapping
    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}